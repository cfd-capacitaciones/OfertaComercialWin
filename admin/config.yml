                  - {label: "Velocidad", name: "velocidad", widget: "string"}
                  - {label: "Precio Regular (S/)", name: "precio_regular", widget: "number", value_type: "float"}
                  - {label: "Precio Promoción (S/)", name: "precio_promo", widget: "number", value_type: "float"}
                  - {label: "Texto Extra", name: "texto_promo", widget: "string", required: false}
                  - {label: "Texto para la Tabla Superior", name: "beneficio_tabla", widget: "string"}
                  - {label: "Destacar Plan", name: "destacado", widget: "boolean", default: false}
                  - {label: "Texto de Cinta", name: "badge", widget: "string", required: false}
                  - {label: "Aplica Oferta Vertical", name: "aplica_vertical", widget: "select", options: ["SI", "NO"]}
                  - {label: "Lista de Beneficios", name: "detalles", widget: "list"}