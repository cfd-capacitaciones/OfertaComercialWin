<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - WIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 relative">
    
    <div class="max-w-7xl mx-auto bg-white rounded-lg shadow-md p-6">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-3xl font-black text-[#ff6b00] tracking-tighter mb-1">win</h1>
                <h2 class="text-xl font-bold text-gray-800">Gestor de Ofertas Comerciales</h2>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="abrirModalNuevo()" class="bg-[#ff6b00] hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded transition-colors shadow-sm">
                    + Nuevo Plan
                </button>
                <button onclick="cerrarSesion()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-4 py-2 rounded transition-colors">
                    Cerrar Sesión
                </button>
            </div>
        </div>

        <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="py-3 px-4 text-left font-semibold text-sm">Región</th>
                        <th class="py-3 px-4 text-left font-semibold text-sm">Plan</th>
                        <th class="py-3 px-4 text-left font-semibold text-sm">Velocidad</th>
                        <th class="py-3 px-4 text-left font-semibold text-sm">Precio Promo</th>
                        <th class="py-3 px-4 text-center font-semibold text-sm">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-planes" class="text-gray-700 text-sm">
                    <tr><td colspan="5" class="text-center py-8">Cargando base de datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MEGA MODAL DE EDICIÓN / CREACIÓN -->
    <div id="modal-editar" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 id="titulo-modal" class="text-2xl font-bold text-gray-800">Oferta Comercial</h3>
                <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            
            <input type="hidden" id="m-id">
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                
                <!-- SELECTORES DINÁMICOS DE REGIÓN Y CATEGORÍA -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Región</label>
                    <select id="m-region" onchange="actualizarCategorias()" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none font-bold text-gray-800 bg-gray-50">
                        <option value="LIMA">LIMA</option>
                        <option value="PROVINCIA">PROVINCIA</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Categoría (Pestaña)</label>
                    <select id="m-categoria" onchange="verificarNuevaCategoria()" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none font-bold text-gray-800 bg-gray-50">
                        <!-- Se llena automáticamente con JS -->
                    </select>
                    <!-- CAJA OCULTA PARA ESCRIBIR LA NUEVA CATEGORÍA -->
                    <input type="text" id="m-nueva-categoria" placeholder="Escribe la nueva pestaña..." class="hidden w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none mt-2 font-semibold text-[#ff6b00] bg-orange-50">
                </div>
                
                <div class="col-span-2 border-b mb-2 mt-1"></div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Plan</label>
                    <input type="text" id="m-nombre" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Velocidad</label>
                    <input type="text" id="m-velocidad" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Precio Regular (S/)</label>
                    <input type="number" step="0.10" id="m-regular" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Precio Promo (S/)</label>
                    <input type="number" step="0.10" id="m-promo" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Texto Promo (Ej: (50% desc.))</label>
                    <input type="text" id="m-texto-promo" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Beneficio Tabla (Ej: 2 Mesh)</label>
                    <input type="text" id="m-beneficio" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none">
                </div>

                <div class="col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">¿Aplica Vertical WIN?</label>
                    <select id="m-vertical" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none">
                        <option value="SI">SI</option>
                        <option value="NO">NO</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">¿Aplica FonoWin? (Solo Provincia)</label>
                    <select id="m-fonowin" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none">
                        <option value="NO">NO</option>
                        <option value="SI">SI</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Orden de visualización (1, 2, 3...)</label>
                    <input type="number" id="m-orden" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Detalles de la Tarjeta (Escribe cada check en una nueva línea)</label>
                    <textarea id="m-detalles" rows="3" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none" placeholder="50% descuento promocional&#10;Fibra Óptica&#10;2 equipos Mesh Wi-Fi"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Texto Promo en Tarjeta (Ej: / 1er mes)</label>
                    <input type="text" id="m-texto-promo-card" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Titulo de la Tarjeta (Opcional)</label>
                    <input type="text" id="m-nombre-card" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#ff6b00] outline-none" placeholder="Si se vacía, usa el de la tabla">
                </div>
            </div>
            
            <div class="flex justify-end space-x-3 pt-4 border-t">
                <button onclick="cerrarModal()" class="px-5 py-2.5 text-gray-600 hover:bg-gray-100 rounded-md font-medium transition-colors">Cancelar</button>
                <button onclick="guardarPlan()" id="btn-guardar" class="px-5 py-2.5 bg-[#ff6b00] text-white rounded-md hover:bg-orange-600 font-medium transition-colors">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script>
        // CREDENCIALES
        const supabaseUrl = 'https://wqrolvaijhxhonegoewr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxcm9sdmFpamh4aG9uZWdvZXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MzgwMjUsImV4cCI6MjEwNTUxNDAyNX0.wz0hAIqCHuL-KnbBav-OgYtC6pOlvycKCmWikLPoH74'; 
        
        const clienteSupabase = supabase.createClient(supabaseUrl, supabaseKey);
        let planesData = []; 

        // --- LÓGICA DE PESTAÑAS INTELIGENTES ---
        const categoriasPorDefecto = {
            'LIMA': ['MONO_RESIDENCIAL', 'XGSPON_GAMER', 'HB_WTV', 'HB_DGO', 'RUC20'],
            'PROVINCIA': ['MONO_RESIDENCIAL', 'HB_WTV', 'HB_DGO', 'RUC20']
        };

        const nombresAmigables = {
            'MONO_RESIDENCIAL': 'Mono Residencial',
            'XGSPON_GAMER': 'XGSPON / Gamer',
            'HB_WTV': 'HB WTV',
            'HB_DGO': 'HB DGO',
            'RUC20': 'RUC 20'
        };

        function actualizarCategorias(categoriaSeleccionada = null) {
            const region = document.getElementById('m-region').value;
            const selectCat = document.getElementById('m-categoria');
            
            // 1. Cargar las pestañas oficiales de la región
            let categorias = [...(categoriasPorDefecto[region] || [])];
            
            // 2. Revisar si existen otras pestañas nuevas en la Base de Datos para esta región
            planesData.forEach(p => {
                const regBD = (p.region || '').toUpperCase();
                const catBD = (p.categoria || '').toUpperCase();
                if (regBD === region && catBD && !categorias.includes(catBD)) {
                    categorias.push(catBD);
                }
            });

            // 3. Imprimir las opciones en el Select
            selectCat.innerHTML = '';
            categorias.forEach(cat => {
                const nombre = nombresAmigables[cat] || cat.replace(/_/g, ' '); // Formato bonito
                selectCat.innerHTML += `<option value="${cat}">${nombre}</option>`;
            });
            
            // 4. Siempre agregar el botón de crear nueva al final
            selectCat.innerHTML += `<option value="NUEVA" style="color: #ff6b00; font-weight: bold;">+ Crear nueva pestaña...</option>`;

            // 5. Autoseleccionar la correcta al editar
            if (categoriaSeleccionada) {
                const catUpper = categoriaSeleccionada.toUpperCase();
                if (categorias.includes(catUpper)) {
                    selectCat.value = catUpper;
                } else {
                    selectCat.value = 'NUEVA';
                    document.getElementById('m-nueva-categoria').value = categoriaSeleccionada;
                }
            }
            
            verificarNuevaCategoria();
        }

        // Muestra u oculta la caja para escribir la nueva categoría
        function verificarNuevaCategoria() {
            const select = document.getElementById('m-categoria');
            const inputNuevo = document.getElementById('m-nueva-categoria');
            
            if (select.value === 'NUEVA') {
                inputNuevo.classList.remove('hidden');
                inputNuevo.focus();
            } else {
                inputNuevo.classList.add('hidden');
                inputNuevo.value = '';
            }
        }
        // ----------------------------------------

        async function verificarSesion() {
            const { data: { user } } = await clienteSupabase.auth.getUser();
            if (!user) window.location.href = '/admin/';
            else cargarPlanes();
        }

        async function cargarPlanes() {
            const { data, error } = await clienteSupabase
                .from('planes_generales')
                .select('*')
                .order('region', { ascending: true })
                .order('id', { ascending: true });
            
            const tbody = document.getElementById('tabla-planes');
            if (error) return tbody.innerHTML = `<tr><td colspan="5" class="text-center text-red-500 py-4">Error al cargar</td></tr>`;
            
            planesData = data;
            renderizarTabla();
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tabla-planes');
            tbody.innerHTML = '';
            
            planesData.forEach(plan => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-orange-50 transition-colors">
                        <td class="py-3 px-4 uppercase text-xs font-bold text-gray-500">${plan.region}</td>
                        <td class="py-3 px-4 font-semibold text-gray-900">${plan.nombre_plan}</td>
                        <td class="py-3 px-4">${plan.velocidad}</td>
                        <td class="py-3 px-4 text-[#ff6b00] font-bold">S/ ${plan.precio_promo}</td>
                        <td class="py-3 px-4 text-center space-x-3">
                            <button onclick="abrirModal(${plan.id})" class="text-blue-600 hover:text-blue-800 font-semibold">Editar</button>
                            <button onclick="eliminarPlan(${plan.id})" class="text-red-500 hover:text-red-700 font-semibold">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function abrirModalNuevo() {
            document.getElementById('titulo-modal').innerText = 'Crear Nuevo Plan';
            document.getElementById('m-id').value = ''; 
            
            document.getElementById('m-region').value = 'LIMA';
            actualizarCategorias('MONO_RESIDENCIAL'); // Actualiza listas según Lima

            document.getElementById('m-nombre').value = '';
            document.getElementById('m-velocidad').value = '';      
            document.getElementById('m-regular').value = '';
            document.getElementById('m-promo').value = '';      
            document.getElementById('m-texto-promo').value = '';
            document.getElementById('m-beneficio').value = '';    
            document.getElementById('m-vertical').value = 'NO';
            document.getElementById('m-fonowin').value = 'NO';
            document.getElementById('m-orden').value = '';    
            document.getElementById('m-detalles').value = '';
            document.getElementById('m-texto-promo-card').value = '';
            document.getElementById('m-nombre-card').value = '';

            document.getElementById('modal-editar').classList.remove('hidden');
        }

        function abrirModal(dato) {
            document.getElementById('titulo-modal').innerText = 'Editar Oferta Comercial';
            let plan = (typeof dato !== 'object') ? planesData.find(p => p.id == dato) : dato;

            if (!plan) return;

            document.getElementById('m-id').value = plan.id; 
            
            document.getElementById('m-region').value = (plan.region || 'LIMA').toUpperCase();
            actualizarCategorias(plan.categoria); // Actualiza listas según región guardada

            document.getElementById('m-nombre').value = plan.nombre_plan || '';
            document.getElementById('m-velocidad').value = plan.velocidad || '';      
            document.getElementById('m-regular').value = (plan.precio_regular !== null && plan.precio_regular !== undefined) ? plan.precio_regular : '';
            document.getElementById('m-promo').value = (plan.precio_promo !== null && plan.precio_promo !== undefined) ? plan.precio_promo : '';      
            document.getElementById('m-texto-promo').value = plan.texto_promo || '';
            document.getElementById('m-beneficio').value = plan.beneficio_tabla || '';    
            document.getElementById('m-vertical').value = plan.aplica_vertical || 'NO';
            document.getElementById('m-fonowin').value = plan.fonowin || 'NO';
            document.getElementById('m-orden').value = plan.orden || '';    
            document.getElementById('m-detalles').value = plan.detalles_card || '';
            document.getElementById('m-texto-promo-card').value = plan['texto-promo-card'] || plan.texto_promo_card || '';
            document.getElementById('m-nombre-card').value = plan['nombre-card'] || plan.nombre_card || '';

            document.getElementById('modal-editar').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-editar').classList.add('hidden');
        }

        async function guardarPlan() {
            const btn = document.getElementById('btn-guardar');
            btn.innerText = 'Guardando...';
            
            const idPlan = document.getElementById('m-id').value;
            
            // Logica para saber si la categoría es nueva
            let categoriaElegida = document.getElementById('m-categoria').value;
            if (categoriaElegida === 'NUEVA') {
                const nombreNuevo = document.getElementById('m-nueva-categoria').value.trim();
                if (!nombreNuevo) {
                    alert("Debes escribir el nombre de la nueva pestaña.");
                    btn.innerText = 'Guardar Cambios';
                    return;
                }
                // Convierte espacios a guiones bajos y en mayúscula (Ej: MI PESTAÑA -> MI_PESTANA)
                categoriaElegida = nombreNuevo.toUpperCase().replace(/\s+/g, '_');
            }

            const datosPlan = {
                region: document.getElementById('m-region').value,
                categoria: categoriaElegida,
                nombre_plan: document.getElementById('m-nombre').value,
                "nombre-card": document.getElementById('m-nombre-card').value, 
                velocidad: document.getElementById('m-velocidad').value,
                precio_regular: parseFloat(document.getElementById('m-regular').value) || 0,
                precio_promo: parseFloat(document.getElementById('m-promo').value) || 0,
                texto_promo: document.getElementById('m-texto-promo').value,
                "texto-promo-card": document.getElementById('m-texto-promo-card').value, 
                beneficio_tabla: document.getElementById('m-beneficio').value,
                aplica_vertical: document.getElementById('m-vertical').value,
                fonowin: document.getElementById('m-fonowin').value,
                orden: parseInt(document.getElementById('m-orden').value) || 0,
                detalles_card: document.getElementById('m-detalles').value
            };

            let consultaExterna;
            if (idPlan === '') {
                consultaExterna = clienteSupabase.from('planes_generales').insert([datosPlan]);
            } else {
                consultaExterna = clienteSupabase.from('planes_generales').update(datosPlan).eq('id', idPlan);
            }

            const { error } = await consultaExterna;

            if (!error) {
                cerrarModal();
                cargarPlanes();
            } else {
                alert('Error al guardar: ' + error.message);
            }
            btn.innerText = 'Guardar Cambios';
        }

        async function eliminarPlan(id) {
            if (confirm("¿Estás segura de eliminar este plan? Esta acción no se puede deshacer.")) {
                const { error } = await clienteSupabase.from('planes_generales').delete().eq('id', id);
                if (!error) {
                    cargarPlanes();
                } else {
                    alert('Error al eliminar: ' + error.message);
                }
            }
        }

        async function cerrarSesion() {
            await clienteSupabase.auth.signOut();
            window.location.href = '/admin/';
        }

        verificarSesion();
    </script>
</body>
</html>
