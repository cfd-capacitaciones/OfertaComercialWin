<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - WIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 relative">
    
    <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-md p-6">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-3xl font-black text-[#ff6b00] tracking-tighter mb-1">win</h1>
                <h2 class="text-xl font-bold text-gray-800">Gestor de Ofertas Comerciales</h2>
            </div>
            <button onclick="cerrarSesion()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-4 py-2 rounded transition-colors">
                Cerrar Sesión
            </button>
        </div>

        <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="py-3 px-4 text-left font-semibold text-sm">Región</th>
                        <th class="py-3 px-4 text-left font-semibold text-sm">Nombre del Plan</th>
                        <th class="py-3 px-4 text-left font-semibold text-sm">Velocidad</th>
                        <th class="py-3 px-4 text-left font-semibold text-sm">Precio Promo</th>
                        <th class="py-3 px-4 text-center font-semibold text-sm">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-planes" class="text-gray-700 text-sm">
                    <tr><td colspan="5" class="text-center py-8">Cargando base de datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Ventana Emergente (Modal) para Editar -->
    <div id="modal-editar" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-xl w-96">
            <h3 class="text-lg font-bold mb-4">Editar Precio Promo</h3>
            <p id="modal-nombre-plan" class="text-sm text-gray-500 mb-4"></p>
            
            <input type="hidden" id="modal-id-plan">
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nuevo Precio (S/)</label>
                <input type="number" step="0.10" id="modal-precio" class="w-full px-3 py-2 border rounded-md focus:ring-[#ff6b00] outline-none">
            </div>
            
            <div class="flex justify-end space-x-3">
                <button onclick="cerrarModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-md">Cancelar</button>
                <button onclick="guardarPrecio()" id="btn-guardar" class="px-4 py-2 bg-[#ff6b00] text-white rounded-md hover:bg-orange-600">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // 1. PEGA TUS CREDENCIALES AQUÍ
        const supabaseUrl = 'https://wqrolvaijhxhonegoewr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxcm9sdmFpamh4aG9uZWdvZXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MzgwMjUsImV4cCI6MjEwNTUxNDAyNX0.wz0hAIqCHuL-KnbBav-OgYtC6pOlvycKCmWikLPoH74'; 
        
        const clienteSupabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function verificarSesion() {
            const { data: { user } } = await clienteSupabase.auth.getUser();
            if (!user) window.location.href = '/admin/';
            else cargarPlanes();
        }

        async function cargarPlanes() {
            const { data, error } = await clienteSupabase.from('planes_lima').select('*').order('region', { ascending: true });
            const tbody = document.getElementById('tabla-planes');
            if (error) return tbody.innerHTML = `<tr><td colspan="5" class="text-center text-red-500 py-4">Error al cargar</td></tr>`;
            
            tbody.innerHTML = '';
            data.forEach(plan => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-orange-50 transition-colors">
                        <td class="py-3 px-4 uppercase text-xs font-bold text-gray-500">${plan.region}</td>
                        <td class="py-3 px-4 font-semibold text-gray-900">${plan.nombre_plan}</td>
                        <td class="py-3 px-4">${plan.velocidad}</td>
                        <td class="py-3 px-4 text-[#ff6b00] font-bold" id="precio-${plan.id}">S/ ${plan.precio_promo}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="abrirModal('${plan.id}', '${plan.nombre_plan}', '${plan.precio_promo}')" class="text-blue-600 hover:text-blue-800 font-semibold px-2">Editar</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Funciones del Modal
        function abrirModal(id, nombre, precioActual) {
        document.getElementById('modal-id-plan').value = id;
        document.getElementById('modal-nombre-plan').innerText = nombre;
    
        // Obtenemos el precio actual directamente de lo que se muestra en la tabla
        const precioEnPantalla = document.getElementById(`precio-${id}`).innerText.replace('S/ ', '').trim();
        document.getElementById('modal-precio').value = precioEnPantalla;
    
        document.getElementById('modal-editar').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-editar').classList.add('hidden');
        }

    async function guardarPrecio() {
    const id = document.getElementById('modal-id-plan').value;
    const nuevoPrecio = document.getElementById('modal-precio').value;
    const btn = document.getElementById('btn-guardar');
    
    btn.innerText = 'Guardando...';
    
    // Añadimos { error } y { data } para capturar la respuesta
    const { data, error } = await clienteSupabase
        .from('planes_lima')
        .update({ precio_promo: parseFloat(nuevoPrecio) })
        .eq('id', id);

    if (!error) {
        document.getElementById(`precio-${id}`).innerText = `S/ ${nuevoPrecio}`;
        cerrarModal();
    } else {
        // Esto nos dirá exactamente el error real de Supabase
        console.error("Error detallado:", error);
        alert("Error de Supabase: " + error.message);
    }
    btn.innerText = 'Guardar';
}

        async function cerrarSesion() {
            await clienteSupabase.auth.signOut();
            window.location.href = '/admin/';
        }

        verificarSesion();
    </script>
</body>
</html>
